<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script src="../Common/js/iframe-phone.js" language="javascript"></script>
    <script src="../Common/js/CodapInterface.js"></script>
    <title>Decision Tree</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <h1>Spiele klassifizieren (Decision Tree + Merkmals-Tabelle) <span class="pill">CODAP Plugin</span></h1>

    <div class="row" style="margin-bottom:8px;">
        <button id="btnSetup">1) Datensätze anlegen</button>
        <button id="btnSample">2) Beispieldaten schreiben</button>
        <button id="btnApplyMapping">3) Merkmalsnamen anwenden</button>
        <button id="btnClassify">4) Klassifizieren</button>
        <button id="btnGraphs">5) Kleine Graphs erzeugen</button>
    </div>

    <div class="row" style="margin-bottom:6px;">
        <label>Spiel auswählen (Pfad markieren):</label>
        <select id="gameSelect"><option value="">—</option></select>
        <button id="btnRefreshList">Liste aktualisieren</button>
        <button id="btnRefreshMapping">Merkmale neu laden</button>
    </div>
    </header>

    <main>
    <div class="grid">
        <div class="card">
            <div class="cardTitle">Decision Tree</div>
            <svg id="treeSvg" width="100%" viewBox="0 0 920 320" style="display:block;"></svg>
            <div id="treeInfo" class="hint" style="margin-top:6px;"></div>
        </div>

        <div><h1>Training</h1></div>

        <div class="card">
            <div class="taskTitle">Set attributes</div>
            
            <div class="row" style="margin-bottom:8px;">
                <label id="attrLabel" style="min-width:110px;">Name</label>
                <input id="attrName" style="min-width:220px;">
                
                <button id="btnAddAttr">Add</button>
                <div class="attrList"></div>
            </div>
            <div class="row"><button id="btnApplyAttr">Apply attributes</div>
        </div>

        <div class="card">
            <div class="taskTitle">Set classes</div>
    
            <div class="row" style="margin-bottom:8px">
                <label id="classLabel" style="min-width:110px;">Name</label>
                <input id="className" style="min-width:220px;">
                
                <button id="btnAddClass">Add</button>
                <div class="classList"></div>
            </div>
            <div class="row"><button id="btnApplyClass">Apply classes</div>
        </div>

        <div class="card">
            <div class="taskTitle">Set training data</div>

            <div class="row" style="margin-bottom:8px;">
                <label id="dataLabel" style="min-width:110px;">Name</label>
                <input id="dataName" placeholder="z.B. Schach" style="min-width:220px;">
                
            </div>
            
            <div class="row" id="inputFormTrain" style="margin-bottom:8px;">
                
                <div id="classDropdown">
                    <label id="classLabel" style="min-width:110px;">Class</label>
                    <select id="classSelect"></select>
                </div>
            </div>
            
            <button id="btnAddTrainData">Add</button>
        </div>
        <div class="row">
            <button id="btnTrain">Train</button>
        </div>
        
        <div><h1>Testing</h1></div>

        <div class="card">
        <div class="taskTitle">Test data</div>

            <div class="row" style="margin-bottom:8px;">
                <label id="lblName" style="min-width:110px;">Name</label>
                <input id="inName" placeholder="z.B. Schach" style="min-width:220px;">
            </div>

            <div class="row" style="margin-bottom:8px;">
                <label id="lblM1" style="min-width:110px;">Attribute1</label>
                <select id="inM1">
                <option value="nein">no</option>
                <option value="ja">yes</option>
                </select>

                <label id="lblM2" style="min-width:110px;">Attribute2</label>
                <select id="inM2">
                <option value="nein">no</option>
                <option value="ja">yes</option>
                </select>

                <label id="lblM3" style="min-width:110px;">Attribute3</label>
                <select id="inM3">
                <option value="nein">no</option>
                <option value="ja">yes</option>
                </select>
            </div>

                <div class="row" style="margin-bottom:8px;">
                    <label id="lblM4" style="min-width:110px;">Attribute4</label>
                    <select id="inM4">
                    <option value="nein">no</option>
                    <option value="ja">yes</option>
                    </select>
                </div>

                <div class="row">
                    <button id="btnAddOne">Add</button>
                </div>
            </div>
        </div>
    </div>

    <pre id="log">Starte… (warte auf CODAP-Verbindung)</pre>
</main>

    <script type="module" src="./js/Main.js"></script>
  </body>
</html>
